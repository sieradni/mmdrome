name: iOS Build

on:
  push:
    branches: [main]
    tags: ['ios-v*']
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned .ipa
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Swift package tests (pure core, macOS host)
        # BackgroundAudioCore is its own dependency-free SPM package; swift test
        # there never sees the Capacitor-bound plugin (Capacitor's XCFrameworks
        # carry no macOS slices, so building the plugin for the host would fail
        # on `import Capacitor`). The plugin only enters the xcodebuild step.
        working-directory: native/BackgroundAudioCore
        run: swift test

      - name: Build web bundle + sync Capacitor (SPM package)
        # VITE_BASE=./ (via build:ios) so asset URLs resolve under capacitor://localhost
        # (the /mmdrome/ base used for gh-pages would 404 on native -> white screen).
        # macOS produces POSIX paths, so fix-spm-path is a no-op here.
        run: npm run sync:ios

      - name: List Xcode schemes (debug)
        run: xcodebuild -project ios/App/App.xcodeproj -list

      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r mmdrome-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmdrome-ios
          path: mmdrome-unsigned.ipa
          retention-days: 14

  # A pushed ios-v* tag publishes a GitHub Release carrying the unsigned IPA
  # as `mmdrome.ipa` — the exact asset sidestore/apps.json points at. Install
  # / update flow is SideStore-only from there: SideStore signs the IPA with
  # the user's own Apple ID on install and refreshes it automatically, so no
  # file is ever transferred by hand.
  release-ios:
    name: Publish iOS release
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: mmdrome-ios
          path: ipa

      - name: Inspect downloaded IPA
        run: ls -la ipa/

      - name: Rename IPA for the release asset
        run: mv ipa/mmdrome-unsigned.ipa ./mmdrome.ipa

      - name: Create GitHub Release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" ./mmdrome.ipa \
            --title "mmdrome iOS ${{ github.ref_name }}" \
            --notes "Unsigned IPA for SideStore (source auto-signs on install). Add the source once in SideStore, then install / update from there."