name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: npm test + npm run check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run check

  smoke:
    name: smoke (built bundle boots)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test (builds dist + serves via vite preview)
        run: npm run test:e2e

      # Job logs need auth to read via the API (annotations do not), so a
      # red smoke run is otherwise undebuggable from the dev box. Surface
      # each failing spec + its first error line as a check annotation.
      # Literal block scalar: the embedded JS keeps its backslashes raw
      # (a double-quoted YAML scalar would eat \? as an escape and
      # invalidate the whole workflow file).
      - name: Annotate e2e failures
        if: failure()
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const san = (s) => String(s ?? '').replace(/\r?\n/g, ' ').replace(/::/g, ':').slice(0, 500);
          // %0A-encoded multiline payloads for annotation bodies (cap ~4k).
          const enc = (s) => String(s ?? '').replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').replace(/::/g, ':').slice(0, 4000);
          let data;
          try {
            data = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));
          } catch (e) {
            console.log('::error title=e2e smoke failed::no results.json (build or server failed before tests ran)');
            process.exit(0);
          }
          let failed = 0;
          const walk = (suites) => {
            for (const s of suites || []) {
              for (const spec of s.specs || []) {
                for (const t of spec.tests || []) {
                  for (const res of t.results || []) {
                    if (res.status === 'passed' || res.status === 'skipped') continue;
                    failed++;
                    const first = ((res.error && res.error.message) || res.status || 'unknown').split('\n')[0];
                    console.log('::error title=e2e failed: ' + san(spec.title) + '::' + san(spec.file) + ':' + (spec.line || '?') + ' ' + san(first));
                  }
                }
              }
              walk(s.suites);
            }
          };
          walk(data.suites);
          if (!failed) console.log('::notice title=e2e smoke failed::step failed with zero failing specs in results.json');
          // error-context.md holds the full expect text + page console output
          // + a DOM snapshot for each failed spec — the decisive evidence.
          try {
            for (const dir of fs.readdirSync('test-results', { withFileTypes: true })) {
              if (!dir.isDirectory()) continue;
              const p = path.join('test-results', dir.name, 'error-context.md');
              if (!fs.existsSync(p)) continue;
              console.log('::error title=e2e context: ' + san(dir.name) + '::' + enc(fs.readFileSync(p, 'utf8')));
            }
          } catch (e) {
            console.log('::notice title=e2e context::could not read error-context files: ' + san(e && e.message));
          }
          "
